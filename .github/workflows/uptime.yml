# Checks okjudge.com from outside every 5 minutes. When it does not answer,
# opens an issue (GitHub emails the repo owner), adds a comment at most once
# an hour while it stays down, and closes the issue after two good checks in
# a row.
# Scheduled runs only happen on the default branch, and GitHub pauses them
# after 60 days without activity in the repo.
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: okjudge.com is down
    steps:
      - name: Check the site
        run: |
          down=""
          for url in https://okjudge.com/ https://okjudge.com/api/v1/config; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --retry 2 --retry-delay 10 --retry-all-errors -f \
              -A "okjudge-uptime (github.com/$GH_REPO)" "$url" 2>/tmp/err) || true
            if [[ $code != 200 ]]; then
              down+="- $url: HTTP ${code:-none} $(tail -n 1 /tmp/err)"$'\n'
            fi
          done
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          # Only an issue this workflow opened counts, since anyone can open one
          # with the same title, and the hourly comment goes by the last "Still
          # down" comment rather than any activity. If the list fails, skip
          # this check instead of opening a second issue.
          issue=$(gh issue list --state open --limit 100 --json number,title,author,createdAt,labels,comments --jq '
            [.[] | select(.title == env.TITLE and .author.login == "app/github-actions")] | first // empty
            | "\(.number) \([.createdAt, (.comments[] | select(.body | startswith("Still down")) | .createdAt)] | max) \(any(.labels[]; .name == "recovering"))"') || {
            echo "Could not list issues; skipping this check."
            exit 0
          }
          read -r number since recovering <<<"$issue" || true
          if [[ -n $down ]]; then
            printf 'Down at %s:\n%s' "$now" "$down"
            if [[ -z $number ]]; then
              gh issue create --title "$TITLE" --body "Down at $now:"$'\n\n'"$down"
            else
              if [[ $recovering == true ]]; then gh issue edit "$number" --remove-label recovering; fi
              if (( $(date +%s) - $(date -d "$since" +%s) >= 3600 )); then
                gh issue comment "$number" --body "Still down at $now:"$'\n\n'"$down"
              fi
            fi
            # The run itself stays green: a failed run would send an email on every check.
            exit 0
          fi
          [[ -n $number ]] || exit 0
          # Close only after two good checks in a row, so a site that keeps
          # dropping out does not open and close an issue every few minutes.
          # The label marks the first good one; labels send no email.
          if [[ $recovering == true ]]; then
            gh issue close "$number" --comment "Back up at $now."
          else
            gh label create recovering --force --color 0e8a16 --description "Site answered once; closes after the next good check"
            gh issue edit "$number" --add-label recovering
          fi
