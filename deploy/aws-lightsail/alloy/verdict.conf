# Drop-in for the alloy.service unit from Grafana's package. Installed to
# /etc/systemd/system/alloy.service.d/ by update.sh; edits there are
# overwritten.
#
# The package's unit reads CONFIG_FILE and CUSTOM_ARGS from /etc/default/alloy,
# and an EnvironmentFile beats Environment=, so the command line is replaced
# here instead of setting those.

[Service]
# Only the GRAFANA_* settings; update.sh copies them from verdict.env.
EnvironmentFile=/etc/alloy/grafana.env
UnsetEnvironment=HOSTNAME
# Caddy's access log is caddy:caddy 640. The package already put alloy in the
# adm and systemd-journal groups, for the journal.
SupplementaryGroups=caddy
ExecStart=
ExecStart=/usr/bin/alloy run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/verdict.alloy
