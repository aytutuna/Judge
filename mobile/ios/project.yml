# XcodeGen spec (https://github.com/yonaskolb/XcodeGen, 2.46+).
# Generate the project on a Mac with `xcodegen generate`; Judge.xcodeproj is
# not committed. See README.md.
name: Judge

options:
  bundleIdPrefix: com.okjudge
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: 2.40.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Judge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Judge
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: Judge
        PRODUCT_BUNDLE_IDENTIFIER: com.okjudge.judge
        INFOPLIST_FILE: Judge/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

  JudgeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JudgeTests
      # Golden data computed by the website's own code (mobile/shared/fixtures).
      - path: ../shared/fixtures/verdicts.json
        buildPhase: resources
      - path: ../shared/fixtures/display-vectors.json
        buildPhase: resources
    dependencies:
      - target: Judge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okjudge.judge.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Judge:
    build:
      targets:
        Judge: all
        JudgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - JudgeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
