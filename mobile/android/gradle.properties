org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API the debug build talks to. Override per machine or per invocation, for
# example: gradlew assembleDebug -Pjudge.apiBaseUrl=http://10.0.2.2:3000
# (debug builds allow cleartext http only to 10.0.2.2, localhost and 127.0.0.1).
# Release builds always use https://okjudge.com.
judge.apiBaseUrl=https://okjudge.com
# Base of the /v/<id> share links. Empty means "same as the API base".
judge.shareBaseUrl=
# Public RevenueCat SDK key for the Google Play app (starts with goog_). Empty
# keeps store purchases off: the pricing screen says "Coming soon".
judge.revenuecatApiKey=
